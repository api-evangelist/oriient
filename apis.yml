name: Oriient
description: >-
  Oriient provides software-only, hardware-free indoor positioning ("indoor GPS")
  and navigation delivered as a SaaS SDK. Its geomagnetic technology reaches
  roughly 1-meter (3-foot) accuracy indoors without Wi-Fi, beacons, or installed
  infrastructure, powering product finding, order picking, visitor navigation,
  asset tracking, and in-store analytics for retail, grocery, and smart-building
  customers across thousands of locations. Oriient New Media Ltd is based in
  Tel Aviv and is a Techstars portfolio company. Oriient ships first-party mobile
  SDKs (including a React-Native Product Location AI package on npm) rather than a
  public REST API; integration is gated behind a customer dashboard and sales.
